<!DOCTYPE html>
<html lang="en" data-bs-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Projects | Scott Li</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- My custom styles (loaded after Bootstrap so they can override it) -->
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <nav class="navbar navbar-expand-lg sticky-top site-nav" data-bs-theme="dark">
        <div class="container">
            <a class="navbar-brand" href="index.html">Scott<span>.</span>Li</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
                    data-bs-target="#mainNav" aria-controls="mainNav"
                    aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="mainNav">
                <ul class="navbar-nav ms-auto align-items-lg-center gap-lg-1">
                    <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
                    <li class="nav-item"><a class="nav-link" href="skills.html">Skills</a></li>
                    <li class="nav-item"><a class="nav-link" href="experience.html">Experience</a></li>
                    <li class="nav-item"><a class="nav-link active" href="projects.html" aria-current="page">Projects</a></li>
                    <li class="nav-item"><a class="nav-link" href="contact.html">Contact</a></li>
                    <li class="nav-item mt-2 mt-lg-0 ms-lg-2">
                        <button id="themeToggle" type="button" class="btn btn-sm btn-outline-accent">☾ Dark</button>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <header class="page-header">
        <div class="container">
            <h1 class="mb-1">Projects</h1>
            <p>Loaded from a JSON file. Filter by category or open a card for details.</p>
        </div>
    </header>

    <main class="container py-5">
        <!-- Filter buttons are created by script.js from the categories in projects.json -->
        <div id="filter-bar" class="filter-bar d-flex flex-wrap gap-2 mb-4" role="group" aria-label="Filter projects by category"></div>

        <!-- Project cards are created by script.js -->
        <div id="project-grid" class="row g-4"></div>
    </main>

    <!-- Details modal (filled in by script.js) -->
    <div class="modal fade" id="projectModal" tabindex="-1" aria-labelledby="modalTitle" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header">
                    <h2 class="modal-title h5" id="modalTitle"></h2>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <span class="badge cat-badge mb-3" id="modalCategory"></span>
                    <p id="modalDesc"></p>
                    <div id="modalTech"></div>
                </div>
                <div class="modal-footer">
                    <a id="modalLink" class="btn btn-accent d-none" href="#" target="_blank" rel="noopener">View on GitHub</a>
                    <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Close</button>
                </div>
            </div>
        </div>
    </div>

    <footer class="site-footer">
        <div class="container d-flex flex-column flex-md-row justify-content-between align-items-center gap-2">
            <span>&copy; 2026 Scott Li</span>
            <span>Built with HTML, CSS, JavaScript &amp; Bootstrap &middot;
                <a href="https://github.com/Scott-Li-Projects" target="_blank" rel="noopener">GitHub</a></span>
        </div>
    </footer>

    <!-- Bootstrap JS bundle (navbar toggler, modal) must load before script.js -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/script.js"></script>
</body>
</html>
